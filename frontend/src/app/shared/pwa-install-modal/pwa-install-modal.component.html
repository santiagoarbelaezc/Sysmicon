<div *ngIf="pwaService.isModalOpen()" 
     (click)="close()" 
     class="fixed inset-0 z-[10000000] bg-black/60 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 select-none animate-modal-backdrop cursor-pointer">
  
  <div (click)="$event.stopPropagation()" 
       (touchstart)="onTouchStart($event)" 
       (touchend)="onTouchEnd($event)" 
       class="w-full max-w-lg bg-white border border-black/20 rounded-[28px] overflow-hidden shadow-[0_30px_90px_rgba(0,0,0,0.3)] flex flex-col text-neutral-900 relative animate-modal-card cursor-default font-sans">
    
    <!-- HEADER DEL MODAL (BLANCO CON LOGO Y BORDES SOBRIOS) -->
    <div class="px-6 py-5 border-b border-black/10 flex items-center justify-between bg-white relative z-20">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-neutral-900 border border-black/20 p-2 flex items-center justify-center shadow-md shrink-0">
          <img src="assets/icons/logo-sysmico-navbar.png" alt="Sysmicon Logo" class="w-full h-full object-contain">
        </div>
        <div>
          <h3 class="font-serif text-lg font-bold text-neutral-900 tracking-wide uppercase">Instalar Aplicación</h3>
          <p class="font-mono text-[10px] text-neutral-500 tracking-widest uppercase">SYSMICON ARCHITECTS PWA</p>
        </div>
      </div>

      <button (click)="close()" 
              aria-label="Cerrar modal de instalación"
              class="w-9 h-9 rounded-full bg-neutral-100 hover:bg-black text-neutral-900 hover:text-white font-mono text-sm font-black transition-all border border-black/15 flex items-center justify-center cursor-pointer shadow-sm">
        ✕
      </button>
    </div>

    <!-- TABS DE PLATAFORMA (iOS / Android) CON ESTILO FOOTER VIP -->
    <div class="px-6 pt-5 pb-2 bg-neutral-50 border-b border-black/5">
      <div class="grid grid-cols-2 p-1.5 rounded-2xl bg-neutral-200/60 border border-black/10">
        
        <!-- Tab iPhone / iPad -->
        <button (click)="setPlatform('ios')" 
                [ngClass]="{
                  'bg-black text-white font-extrabold shadow-md scale-[1.02]': platform() === 'ios',
                  'text-neutral-600 hover:text-black font-medium': platform() !== 'ios'
                }"
                class="py-2.5 px-4 rounded-xl text-xs tracking-wider uppercase font-sans flex items-center justify-center gap-2 transition-all cursor-pointer">
          <!-- Icono Apple SVG -->
          <svg class="w-4 h-4 fill-current" viewBox="0 0 170 170">
            <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-5.04.25-9.97-1.78-14.8-6.09-3.32-2.88-7.23-7.58-11.73-14.1-6.17-8.99-10.9-18.75-14.18-29.28-3.27-10.53-4.91-20.73-4.91-30.6 0-11.44 2.8-21.2 8.39-29.28 5.59-8.08 12.87-12.24 21.84-12.49 4.69 0 9.77 1.14 15.24 3.43 5.47 2.29 9.3 3.44 11.5 3.44 2.03 0 5.88-1.15 11.54-3.44 5.66-2.29 10.49-3.35 14.5-3.18 10.02.76 18.03 4.41 24.03 10.95-21.72 13.15-20.71 34.34 3.05 46.13-4.74 11.62-10.75 22.84-18.01 33.66zM119.22 31.06c0-6.79 2.5-13.32 7.5-19.59 5.01-6.28 11.39-10.39 19.14-12.35 0.51 7.21-1.87 13.91-7.14 20.1-5.26 6.19-11.7 10.22-19.32 12.08-.18-.08-.18-.16-.18-.24z"/>
          </svg>
          <span>iPhone / iPad</span>
        </button>

        <!-- Tab Android -->
        <button (click)="setPlatform('android')" 
                [ngClass]="{
                  'bg-black text-white font-extrabold shadow-md scale-[1.02]': platform() === 'android',
                  'text-neutral-600 hover:text-black font-medium': platform() !== 'android'
                }"
                class="py-2.5 px-4 rounded-xl text-xs tracking-wider uppercase font-sans flex items-center justify-center gap-2 transition-all cursor-pointer">
          <!-- Icono Android / Chrome SVG -->
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M6 18c0 .55.45 1 1 1h1v3c0 .55.45 1 1 1s1-.45 1-1v-3h4v3c0 .55.45 1 1 1s1-.45 1-1v-3h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5ptM15.53 2.16l1.3-1.3c.2-.2.2-.51 0-.71a.498.498 0 0 0-.7 0l-1.48 1.48C13.67 1.23 12.38 1 11 1c-1.38 0-2.67.23-3.65.63L5.87.15a.498.498 0 0 0-.7 0c-.2.2-.2.51 0 .71l1.3 1.3C4.54 3.39 3.25 5.56 3 8h16c-.25-2.44-1.54-4.61-3.47-5.84zM8 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm8 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
          </svg>
          <span>Android</span>
        </button>

      </div>
    </div>

    <!-- CUERPO PRINCIPAL DEL CARRUSEL EN TEMA BLANCO -->
    <div class="px-6 py-6 flex flex-col items-center text-center relative min-h-[310px] justify-between bg-white">
      
      <!-- Indicador de Paso (Badge Header) -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-neutral-100 border border-black/15 font-mono text-[11px] text-neutral-800 tracking-widest uppercase mb-4">
        <span class="w-2 h-2 rounded-full bg-black animate-pulse"></span>
        <span>{{ currentStepData.badge }}</span>
      </div>

      <!-- ÍCONO E ILUSTRACIÓN VISUAL DEL PASO EN CAJA NEGRA ELEGANTE -->
      <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-neutral-900 border border-black/20 text-white p-4 flex items-center justify-center mb-4 shadow-xl relative group shrink-0">
        
        <!-- ÍCONO DINÁMICO POR PASO DE IOS -->
        <ng-container *ngIf="platform() === 'ios'">
          <!-- Paso 1: Safari -->
          <svg *ngIf="currentStep() === 0" class="w-10 h-10 sm:w-12 sm:h-12 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg>
          <!-- Paso 2: Botón Compartir Safari -->
          <svg *ngIf="currentStep() === 1" class="w-10 h-10 sm:w-12 sm:h-12 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
          <!-- Paso 3: Agregar a Inicio -->
          <svg *ngIf="currentStep() === 2" class="w-10 h-10 sm:w-12 sm:h-12 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
          <!-- Paso 4: Confirmar -->
          <svg *ngIf="currentStep() === 3" class="w-10 h-10 sm:w-12 sm:h-12 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <rect x="5" y="2" width="14" height="20" rx="3"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </ng-container>

        <!-- ÍCONO DINÁMICO POR PASO DE ANDROID -->
        <ng-container *ngIf="platform() === 'android'">
          <!-- Paso 1: Chrome -->
          <svg *ngIf="currentStep() === 0" class="w-10 h-10 sm:w-12 sm:h-12 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <line x1="21.17" y1="8" x2="12" y2="8"/>
            <line x1="3.95" y1="6.06" x2="8.54" y2="14"/>
            <line x1="10.88" y1="21.94" x2="15.46" y2="14"/>
          </svg>
          <!-- Paso 2: Menú 3 puntos -->
          <svg *ngIf="currentStep() === 1" class="w-10 h-10 sm:w-12 sm:h-12 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="1.5"/>
            <circle cx="12" cy="12" r="1.5"/>
            <circle cx="12" cy="19" r="1.5"/>
          </svg>
          <!-- Paso 3: Instalar App -->
          <svg *ngIf="currentStep() === 2" class="w-10 h-10 sm:w-12 sm:h-12 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <!-- Paso 4: Confirmar Android -->
          <svg *ngIf="currentStep() === 3" class="w-10 h-10 sm:w-12 sm:h-12 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <rect x="5" y="2" width="14" height="20" rx="3"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </ng-container>
      </div>

      <!-- TÍTULO Y SUBTÍTULO -->
      <div class="space-y-1 mb-3">
        <h4 class="font-serif text-xl sm:text-2xl font-bold text-neutral-900 uppercase tracking-wide">
          {{ currentStepData.titulo }}
        </h4>
        <p class="font-mono text-xs text-neutral-500 uppercase tracking-widest font-semibold">
          {{ currentStepData.subtitulo }}
        </p>
      </div>

      <!-- TEXTO DE INSTRUCCIÓN DETALLADO -->
      <p class="font-sans text-xs sm:text-sm text-neutral-600 max-w-md leading-relaxed font-normal">
        {{ currentStepData.instruccion }}
      </p>

    </div>

    <!-- CONTROLES Y NAVEGACIÓN DEL CARRUSEL (FOOTER EN BLANCO CON BOTONES NEGROS) -->
    <div class="px-6 py-4 bg-neutral-50 border-t border-black/10 flex flex-col gap-3">
      
      <div class="flex items-center justify-between">
        
        <!-- Botón Anterior -->
        <button (click)="anteriorPaso()" 
                aria-label="Paso anterior"
                class="px-4 py-2.5 rounded-xl bg-neutral-200/80 hover:bg-neutral-300 text-neutral-900 font-mono text-xs font-bold transition-all border border-black/10 flex items-center gap-1.5 cursor-pointer">
          <span class="text-sm font-black">←</span>
          <span>Anterior</span>
        </button>

        <!-- Indicadores de Puntos (Dots) -->
        <div class="flex items-center gap-2">
          <button *ngFor="let s of activeSteps; let idx = index"
                  (click)="setStepIndex(idx)"
                  [attr.aria-label]="'Ir al paso ' + (idx + 1)"
                  [ngClass]="{
                    'w-6 bg-black': currentStep() === idx,
                    'w-2 bg-neutral-300 hover:bg-neutral-400': currentStep() !== idx
                  }"
                  class="h-2 rounded-full transition-all duration-300 cursor-pointer">
          </button>
        </div>

        <!-- Botón Siguiente -->
        <button (click)="siguientePaso()" 
                aria-label="Paso siguiente"
                class="px-5 py-2.5 rounded-xl bg-black hover:bg-neutral-800 text-white font-mono text-xs font-extrabold transition-all shadow-md flex items-center gap-1.5 cursor-pointer">
          <span>Siguiente</span>
          <span class="text-sm font-black">→</span>
        </button>

      </div>

      <!-- BOTÓN DIRECTO SI NATIVAMENTE DISPONIBLE (Google Chrome Android / Edge) -->
      <button *ngIf="pwaService.canInstallNative()" 
              (click)="promptNative()" 
              class="w-full py-3.5 px-5 rounded-2xl bg-black hover:bg-neutral-800 text-white font-sans text-xs font-extrabold tracking-widest uppercase transition-all shadow-xl hover:scale-[1.02] cursor-pointer flex items-center justify-center gap-2 mt-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>INSTALAR AHORA EN 1 CLIC</span>
      </button>

      <!-- Botón Entendido para cerrar -->
      <button (click)="close()" 
              class="w-full py-2.5 px-4 rounded-xl bg-white hover:bg-neutral-100 text-neutral-600 hover:text-black font-mono text-[11px] font-bold tracking-widest uppercase transition-all text-center cursor-pointer border border-black/10">
        CERRAR GUÍA DE INSTALACIÓN
      </button>

    </div>

  </div>

</div>
