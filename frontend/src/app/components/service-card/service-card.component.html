<div class="service-card-wrapper rounded-3xl border border-neutral-200 bg-white shadow-md hover:shadow-xl transition-all duration-500 overflow-hidden relative group">
  
  <div class="grid grid-cols-1 lg:grid-cols-12 min-h-[480px] lg:min-h-[520px]">
    <!-- COLUMNA IMAGEN DE PROYECTO MAXIMIZADA (Cols 1-7, Alternada por índice) -->
    <div class="lg:col-span-7 relative overflow-hidden bg-[#000814] min-h-[380px] lg:min-h-full flex flex-col justify-center items-center p-6 group/img"
         [ngClass]="{'order-1 lg:order-1': index % 2 === 0, 'order-1 lg:order-2': index % 2 !== 0}">
      
      <!-- Imagen nativa para renderizado nítido -->
      <img *ngIf="servicio.imagen" 
           [src]="servicio.imagen" 
           [alt]="servicio.titulo"
           class="absolute inset-0 w-full h-full object-cover transition-transform duration-[1200ms] group-hover/img:scale-105 opacity-95">

      <!-- Gradiente elegante para contraste -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-black/40"></div>

      <!-- TÍTULO EDITORIAL EN EL CENTRO DE LA FOTO -->
      <div class="relative z-20 text-center px-6 pointer-events-none transition-transform duration-500 group-hover/img:scale-[1.03]">
        <h3 class="font-serif text-3xl sm:text-4xl lg:text-5xl font-light tracking-[0.18em] text-white uppercase drop-shadow-[0_12px_30px_rgba(0,0,0,0.95)]">
          {{ servicio.titulo }}
        </h3>
      </div>

      <!-- Indicador de Fase Abajo -->
      <div *ngIf="servicio.fase" class="absolute bottom-7 inset-x-0 text-center pointer-events-none z-20">
        <span class="font-mono text-[11px] text-white/80 tracking-[0.28em] uppercase drop-shadow">
          {{ servicio.fase }}
        </span>
      </div>
    </div>

    <!-- COLUMNA CONTENIDO CONTEXTUAL CONCENTRADO Y CONCISO (Cols 8-12) -->
    <div class="lg:col-span-5 p-7 md:p-10 flex flex-col justify-between bg-white relative"
         [ngClass]="{'order-2 lg:order-2': index % 2 === 0, 'order-2 lg:order-1': index % 2 !== 0}">
      
      <!-- Contenido conciso -->
      <div>
        <span class="font-mono text-xs tracking-widest text-neutral-400 uppercase font-semibold block mb-2">
          {{ servicio.subtitulo }}
        </span>
        
        <h3 class="font-serif text-2xl md:text-3xl font-bold text-neutral-900 mb-3 leading-tight uppercase">
          {{ servicio.titulo }}
        </h3>
        
        <p class="font-sans text-neutral-600 text-sm md:text-base leading-relaxed mb-6 font-light">
          {{ servicio.descripcion }}
        </p>

        <!-- Puntos clave ultraconcisos -->
        <div *ngIf="servicio.caracteristicas && servicio.caracteristicas.length > 0" class="flex flex-wrap gap-2 mb-6">
          <span *ngFor="let item of servicio.caracteristicas" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-neutral-100 border border-neutral-200 text-xs font-medium text-neutral-800 hover:bg-black hover:text-white transition-all cursor-default">
            <span class="w-1.5 h-1.5 rounded-full bg-black shrink-0"></span>
            <span>{{ item }}</span>
          </span>
        </div>
      </div>

      <!-- Botón CTA Estilo Píldora Negra -->
      <div class="pt-5 border-t border-neutral-100 flex items-center justify-start mt-auto">
        <a routerLink="/cotiza-con-nosotros" [queryParams]="{servicio: servicio.titulo}" 
           class="inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full bg-black hover:bg-neutral-800 text-white font-sans text-xs font-bold tracking-[0.18em] uppercase transition-all duration-300 hover:scale-105 shadow-sm cursor-pointer">
          <span>COTIZAR SERVICIO</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
      </div>

    </div>
  </div>
</div>
