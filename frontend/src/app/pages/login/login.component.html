<div class="w-full min-h-screen bg-black text-white flex overflow-hidden font-sans fixed inset-0 z-0">
  
  <!-- Contenedor Principal: 2 columnas en Desktop, 1 columna en Móvil -->
  <div class="w-full h-screen grid grid-cols-1 lg:grid-cols-12 relative z-10">
    
    <!-- ========================================================================
         COLUMNA IZQUIERDA: VISUAL ARQUITECTÓNICO CINEMÁTICO (Cols 1-7)
         ======================================================================== -->
    <div class="lg:col-span-7 relative overflow-hidden bg-neutral-950 hidden lg:flex flex-col justify-between p-12 xl:p-16 h-screen">
      
      <!-- Fondo de Fotografía de Autor con Zoom Sutil -->
      <div class="absolute inset-0 bg-cover bg-center filter brightness-[0.42] contrast-[1.15] scale-[1.02] transition-transform duration-[12000ms] hover:scale-105"
           style="background-image: url('/images/imagen1.jpg');">
      </div>

      <!-- Gradiente y viñeta cinemática para legibilidad impecable -->
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/70 pointer-events-none"></div>
      <div class="absolute inset-0 bg-radial-gradient from-transparent via-black/30 to-black/80 pointer-events-none"></div>



      <!-- Titular Principal Minimalista con Letra Grande y Logo Hero -->
      <div class="relative z-10 max-w-xl space-y-6 my-auto">
        <!-- Logo del Hero -->
        <div class="flex items-center">
          <img src="assets/icons/logo-hero.png" 
               alt="Sysmicon" 
               class="h-20 sm:h-24 md:h-28 w-auto object-contain drop-shadow-[0_15px_35px_rgba(0,0,0,0.9)] animate-pulse"
               style="animation-duration: 4s;">
        </div>

        <div>
          <h2 class="font-serif text-3xl sm:text-5xl xl:text-6xl font-light text-white tracking-tight leading-[1.15] max-w-lg">
            Diseñamos y construimos el lugar de tus sueños
          </h2>
        </div>

        <div class="pt-2">
          <a routerLink="/cotiza-con-nosotros" 
             class="inline-flex items-center gap-3 px-8 py-4 rounded-full bg-white text-neutral-950 hover:bg-neutral-200 transition-all duration-300 font-sans text-xs sm:text-sm font-bold tracking-[0.2em] uppercase shadow-2xl hover:scale-105 cursor-pointer group">
            <span>Comunícate con nosotros</span>
            <svg class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
            </svg>
          </a>
        </div>
      </div>



    </div>

    <!-- ========================================================================
         COLUMNA DERECHA: FORMULARIO MINIMALISTA (Cols 8-12)
         ======================================================================== -->
    <div class="lg:col-span-5 h-screen px-6 sm:px-10 lg:px-10 xl:px-14 pt-24 sm:pt-28 pb-8 relative bg-neutral-950 overflow-y-auto flex flex-col justify-center">
      
      <!-- Iluminación ambiental sutil de fondo -->
      <div class="absolute top-1/3 right-10 w-80 h-80 rounded-full bg-white/[0.03] blur-[120px] pointer-events-none"></div>

      <div class="max-w-[480px] w-full mx-auto relative z-10 py-6">
        
        <!-- Encabezado Limpio con Menos Texto y Tipografía Grande -->
        <div class="mb-8 text-left">
          <h1 class="font-serif text-3xl sm:text-4xl lg:text-5xl font-light text-white tracking-tight uppercase leading-tight">
            INICIAR <span class="font-serif italic text-neutral-300">SESIÓN</span>
          </h1>
          <p class="font-sans text-sm sm:text-base text-neutral-400 font-light mt-2">
            Accede a tu estación de trabajo y proyectos privados.
          </p>
        </div>

        <!-- Alertas de Error o Éxito -->
        <div *ngIf="errorMessage()" class="w-full p-4 rounded-2xl bg-red-950/80 border border-red-800 text-red-200 text-sm mb-5 flex items-center gap-3 animate-fade shadow-lg">
          <svg class="w-5 h-5 shrink-0 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>{{ errorMessage() }}</span>
        </div>

        <div *ngIf="successMessage()" class="w-full p-4 rounded-2xl bg-emerald-950/90 border border-emerald-600 text-emerald-200 text-sm font-semibold mb-5 flex items-center gap-3 animate-fade shadow-xl">
          <svg class="w-5 h-5 shrink-0 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>{{ successMessage() }}</span>
        </div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form (submit)="onLogin($event)" class="w-full space-y-5">
          
          <!-- CORREO ELECTRÓNICO -->
          <div class="space-y-2">
            <label for="login-email" class="block font-mono text-xs sm:text-[13px] tracking-[0.2em] text-neutral-300 uppercase font-semibold">
              CORREO ELECTRÓNICO *
            </label>
            <input type="email" id="login-email" [(ngModel)]="loginEmail" name="loginEmail" required
                   placeholder="correo@ejemplo.com"
                   class="w-full bg-white/[0.05] border border-white/20 rounded-2xl px-5 sm:px-6 py-4 sm:py-4.5 text-white placeholder-neutral-500 font-sans text-base sm:text-lg focus:outline-none focus:border-white focus:ring-2 focus:ring-white/20 transition-all">
          </div>

          <!-- CONTRASEÑA -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label for="login-pass" class="block font-mono text-xs sm:text-[13px] tracking-[0.2em] text-neutral-300 uppercase font-semibold">
                CONTRASEÑA *
              </label>
              <a routerLink="/olvide-mi-contrasena" class="text-xs sm:text-sm text-neutral-400 hover:text-white font-sans transition-colors underline decoration-white/20 underline-offset-4">
                ¿Olvidaste tu contraseña?
              </a>
            </div>
            <div class="relative">
              <input [type]="showPassword() ? 'text' : 'password'" id="login-pass" [(ngModel)]="loginPass" name="loginPass" required
                     placeholder="••••••••••••"
                     class="w-full bg-white/[0.05] border border-white/20 rounded-2xl px-5 sm:px-6 py-4 sm:py-4.5 pr-14 text-white placeholder-neutral-500 font-sans text-base sm:text-lg focus:outline-none focus:border-white focus:ring-2 focus:ring-white/20 transition-all">
              <button type="button" (click)="togglePassword()" class="absolute right-5 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-white transition-colors cursor-pointer p-1">
                <svg *ngIf="!showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                <svg *ngIf="showPassword()" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
              </button>
            </div>
          </div>

          <!-- RECORDAR SESIÓN -->
          <div class="flex items-center pt-1">
            <label class="flex items-center gap-3 cursor-pointer text-sm text-neutral-400 hover:text-neutral-300 select-none">
              <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe"
                     class="w-4 h-4 rounded bg-white/10 border-white/20 text-neutral-900 focus:ring-0 cursor-pointer">
              <span>Recordar sesión</span>
            </label>
          </div>

          <!-- BOTÓN DE INGRESO -->
          <div class="pt-3">
            <button type="submit" [disabled]="isSubmitting()"
                    class="group w-full py-4.5 sm:py-5 px-8 rounded-full bg-white text-neutral-950 hover:bg-neutral-200 disabled:opacity-50 transition-all duration-300 font-sans text-sm sm:text-base font-bold tracking-[0.2em] uppercase shadow-2xl flex items-center justify-center gap-3 cursor-pointer">
              <span *ngIf="!isSubmitting()">INGRESAR AL PORTAL</span>
              <span *ngIf="isSubmitting()">ACCEDIENDO...</span>
              <svg *ngIf="!isSubmitting()" class="w-5 h-5 transform group-hover:translate-x-1.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7"/>
              </svg>
            </button>
          </div>

        </form>

      </div>

    </div>

  </div>
</div>
