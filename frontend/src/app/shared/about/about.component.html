<div id="nosotros-section" class="sticky-scroll-wrapper" #stickyWrapper>
  <section class="banner-container relative w-full h-screen bg-black overflow-hidden flex items-center justify-center border-y border-neutral-900">
    
    <!-- Capas fotográficas cinematográficas de fondo -->
    <div class="background-layers absolute inset-0 z-0">
      <div 
        *ngFor="let val of slides; let i = index"
        class="bg-layer"
        [class.active]="activeIndex === i">
        <img [src]="val.image" [alt]="val.title" class="bg-img">
        <div class="overlay"></div>
        <div class="overlay-radial"></div>
      </div>
    </div>

    <!-- Marcas arquitectónicas de esquina (Estilo Cotiza / Hero) -->
    <div class="absolute top-8 inset-x-8 sm:inset-x-14 flex justify-between pointer-events-none select-none z-20 text-white/35 font-mono text-xs tracking-[0.25em]">
      <span>+ SYS_STUDIO</span>
      <span>FILOSOFÍA // 2026 +</span>
    </div>

    <div class="absolute bottom-8 inset-x-8 sm:inset-x-14 hidden sm:flex justify-between pointer-events-none select-none z-20 text-white/35 font-mono text-xs tracking-[0.25em]">
      <span>0{{ activeIndex + 1 }} // 0{{ slides.length }}</span>
      <span class="animate-pulse">DESLIZA PARA EXPLORAR ↓</span>
    </div>

    <!-- Contenido Central Pin (Pinnable layout con Letra Gigante y Menos Texto) -->
    <div class="content-wrapper-pin relative z-10 w-full max-w-[1720px] mx-auto px-6 sm:px-12 flex items-center justify-center">
      <div 
        *ngFor="let val of slides; let i = index"
        class="value-content-pin w-full"
        [class.active]="activeIndex === i">
        
        <div class="text-content max-w-5xl mx-auto text-center space-y-6 sm:space-y-8">
          


          <!-- Título Principal en Mayúsculas y Letra Extra Grande -->
          <h2 class="font-serif text-4xl sm:text-6xl md:text-7xl lg:text-8xl xl:text-9xl font-light text-white tracking-tight leading-[1.02] uppercase drop-shadow-2xl">
            {{ val.title }} <br class="hidden sm:inline"/>
            <span class="font-serif italic font-normal text-neutral-300 uppercase">{{ val.titleHighlight }}</span>
          </h2>
          
          <!-- Botón de Acción de Lujo Ampliado en Mayúsculas -->
          <div class="action-wrap pt-2" [class.show]="activeIndex === i">
            <a routerLink="/nosotros" 
               class="group/btn inline-flex items-center justify-center gap-3.5 px-9 sm:px-12 py-4.5 sm:py-5 rounded-full bg-white text-neutral-950 hover:bg-neutral-200 transition-all duration-300 font-sans text-xs sm:text-sm font-bold tracking-[0.2em] uppercase shadow-[0_20px_60px_rgba(0,0,0,0.85)] hover:scale-105 cursor-pointer whitespace-nowrap">
              <span>CONOCE NUESTRO ESTUDIO</span>
              <svg class="w-4 h-4 shrink-0 transform group-hover/btn:translate-x-1.5 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7"/>
              </svg>
            </a>
          </div>

        </div>

      </div>
    </div>

    <!-- Indicador de Navegación / Barras de Progreso Minimalistas -->
    <div class="scroll-indicators absolute bottom-8 sm:bottom-10 left-1/2 -translate-x-1/2 flex items-center gap-2.5 z-20 select-none">
      <button 
        *ngFor="let val of slides; let i = index" 
        class="nav-indicator-bar cursor-pointer" 
        [class.active]="activeIndex === i"
        (click)="scrollToIndex(i)"
        [attr.aria-label]="val.subtitle">
      </button>
    </div>

  </section>
</div>
