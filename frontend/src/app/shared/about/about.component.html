<div id="nosotros-section" class="sticky-scroll-wrapper" #stickyWrapper>
  <section class="banner-container">
    
    <!-- Background Layers with Native <img> for Bright High-Res Visibility -->
    <div class="background-layers">
      <div 
        *ngFor="let val of slides; let i = index"
        class="bg-layer"
        [class.active]="activeIndex === i">
        <img [src]="val.image" [alt]="val.title" class="bg-img">
        <div class="overlay"></div>
      </div>
    </div>

    <!-- Center Content Overlay (Pinnable layout) -->
    <div class="content-wrapper-pin">
      <div 
        *ngFor="let val of slides; let i = index"
        class="value-content-pin"
        [class.active]="activeIndex === i">
        
        <div class="text-content">
          <!-- Subtle White Subtitle with Underline -->
          <div class="subtitle-wrapper">
            <p class="subtitle">{{ val.subtitle }}</p>
            <div class="subtitle-underline"></div>
          </div>

          <!-- Main Title Estilo Hero (Ligero en Blanco + Cursiva Azul Hielo) -->
          <h2 class="title font-serif">
            {{ val.title }} <span class="font-serif italic font-normal text-[#C2E1FF]">{{ val.titleHighlight }}</span>
          </h2>
          
          <!-- Description -->
          <p *ngIf="val.description" class="description font-sans">{{ val.description }}</p>
          
          <!-- CTA Action — Estilo Exacto del Botón del Hero -->
          <div class="action-wrap" [class.show]="activeIndex === i">
            <a routerLink="/nosotros" class="group/btn inline-flex items-center gap-3 px-8 py-4 rounded-lg bg-white text-[#000814] hover:bg-[#C2E1FF] transition-all duration-500 font-sans text-xs font-bold tracking-[0.24em] uppercase shadow-2xl hover:scale-105 cursor-pointer">
              <span>CONOCE NUESTRA HISTORIA Y EQUIPO</span>
              <svg class="w-4 h-4 transform group-hover/btn:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Scroll Indicators / Navigation Dots -->
    <div class="scroll-dots">
      <span 
        *ngFor="let val of slides; let i = index" 
        class="dot" 
        [class.active]="activeIndex === i"
        (click)="scrollToIndex(i)"
        [attr.title]="val.subtitle">
      </span>
    </div>

  </section>
</div>
