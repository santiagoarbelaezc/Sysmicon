name: Frontend CI (Angular)

# NOTA: CI automático en push temporalmente desactivado a petición del desarrollador.
on:
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build-test:
    name: Angular Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline

      - name: Build Angular Frontend (Production)
        run: |
          cd frontend
          npm run build -- --configuration production

      - name: Verify Build Artifacts
        run: |
          test -f frontend/dist/frontend/browser/index.html || (echo "index.html missing!" && exit 1)
          test -f frontend/dist/frontend/browser/.htaccess || (echo ".htaccess missing in frontend build!" && exit 1)
          echo "Frontend build successfully verified!"

