<!-- Servicios Section (Carrusel Interactivo Ultra-Limpio & Minimalista) -->
<section id="servicios-section" class="services-section relative w-full py-20 sm:py-28 bg-white text-neutral-900 overflow-hidden font-sans">
  <div class="max-w-[1500px] mx-auto px-6 sm:px-12 lg:px-16 relative z-10">
    
    <!-- Header de Sección (Titular Minimalista & Indicador 01 / 04) -->
    <div class="flex flex-col md:flex-row items-start md:items-end justify-between gap-6 mb-12">
      <div class="text-left max-w-3xl space-y-2">
        <span class="font-mono text-xs tracking-[0.3em] text-neutral-400 font-semibold uppercase block">
          NUESTROS SERVICIOS
        </span>
        <h2 class="font-serif text-3xl sm:text-4xl lg:text-5xl text-neutral-900 font-bold leading-tight tracking-tight uppercase">
          SOLUCIONES ARQUITECTÓNICAS DE <span class="font-serif italic font-normal text-neutral-500">PRINCIPIO A FIN</span>
        </h2>
        <p class="font-sans text-base sm:text-lg text-neutral-600 font-light leading-relaxed pt-1">
          Diseñamos y construimos bajo un único liderazgo técnico hogares y fincas campestres con exactitud milimétrica.
        </p>
      </div>

      <!-- Indicador de Posición de Slide (01 / 04) -->
      <div class="font-mono text-xs tracking-[0.25em] text-neutral-500 font-bold px-5 py-2.5 rounded-full bg-neutral-100 border border-neutral-200 shadow-xs shrink-0">
        <span class="text-black font-extrabold">0{{ activeServiceIndex() + 1 }}</span> <span class="text-neutral-400">/ 0{{ servicios.length }}</span>
      </div>
    </div>

    <!-- Carrusel de Tarjetas de Servicios con Botones Laterales Flotantes -->
    <div class="relative w-full"
         (wheel)="onServicesWheel($event)"
         (touchstart)="onTouchStart($event)"
         (touchend)="onTouchEnd($event)">

      <!-- Botón de Navegación Izquierda -->
      <button (click)="prevService()" 
              class="absolute -left-2 sm:-left-4 lg:-left-6 top-1/2 -translate-y-1/2 z-30 w-12 h-12 lg:w-14 lg:h-14 rounded-full border border-neutral-300 bg-white/90 backdrop-blur-md hover:bg-black hover:text-white text-neutral-900 flex items-center justify-center transition-all duration-300 shadow-xl hover:scale-110 cursor-pointer group"
              title="Anterior Servicio">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-0.5 transition-transform"><path d="m15 18-6-6 6-6"/></svg>
      </button>

      <!-- Botón de Navegación Derecha -->
      <button (click)="nextService()" 
              class="absolute -right-2 sm:-right-4 lg:-right-6 top-1/2 -translate-y-1/2 z-30 w-12 h-12 lg:w-14 lg:h-14 rounded-full border border-neutral-300 bg-white/90 backdrop-blur-md hover:bg-black hover:text-white text-neutral-900 flex items-center justify-center transition-all duration-300 shadow-xl hover:scale-110 cursor-pointer group"
              title="Siguiente Servicio">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-0.5 transition-transform"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      
      <!-- Contenedor con Track Deslizante Continuo 100% Fiable & Suave -->
      <div class="overflow-hidden rounded-3xl w-full">
        <div class="flex transition-transform duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] w-full"
             [style.transform]="'translateX(-' + (activeServiceIndex() * 100) + '%)'">
          <div *ngFor="let s of servicios; let i = index" class="w-full shrink-0">
            <app-service-card [servicio]="s" [index]="i"></app-service-card>
          </div>
        </div>
      </div>

    </div>

    <!-- Dots Indicadores del Carrusel -->
    <div class="flex items-center justify-center gap-3 mt-8">
      <button *ngFor="let s of servicios; let i = index"
              (click)="goToService(i)"
              class="h-2.5 rounded-full transition-all duration-500 cursor-pointer"
              [ngClass]="activeServiceIndex() === i ? 'w-10 bg-black' : 'w-2.5 bg-neutral-300 hover:bg-neutral-500'"
              [title]="s.titulo">
      </button>
    </div>

  </div>
</section>
