<div id="nosotros-section" class="sticky-scroll-wrapper" #stickyWrapper>
  <section class="banner-container">
    
    <!-- Background Layers with Native <img> for Bright High-Res Visibility -->
    <div class="background-layers">
      <div 
        *ngFor="let val of slides; let i = index"
        class="bg-layer"
        [class.active]="activeIndex === i">
        <img [src]="val.image" [alt]="val.title" class="bg-img">
        <div class="overlay"></div>
      </div>
    </div>

    <!-- Center Content Overlay (Pinnable layout) -->
    <div class="content-wrapper-pin">
      <div 
        *ngFor="let val of slides; let i = index"
        class="value-content-pin"
        [class.active]="activeIndex === i">
        
        <div class="text-content">
          <!-- Título Principal en Mayúsculas y Letra Más Grande -->
          <h2 class="title font-serif text-4xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl font-light text-white tracking-tight leading-[1.05] uppercase drop-shadow-2xl mb-8">
            {{ val.title }} <span class="font-serif italic font-normal text-[#C2E1FF] uppercase">{{ val.titleHighlight }}</span>
          </h2>
          
          <!-- Description -->
          <p *ngIf="val.description" class="description font-sans text-white/90 font-light text-lg sm:text-xl max-w-3xl leading-relaxed mb-8 uppercase">{{ val.description }}</p>
          
          <!-- Botón de Acción de Lujo Ampliado en Mayúsculas -->
          <div class="action-wrap" [class.show]="activeIndex === i">
            <a routerLink="/nosotros" class="group/btn inline-flex items-center justify-center gap-4 px-11 py-5 rounded-full bg-white text-[#000814] hover:bg-[#C2E1FF] transition-all duration-500 font-sans text-xs sm:text-sm font-bold tracking-[0.24em] uppercase shadow-[0_10px_35px_rgba(0,0,0,0.6)] hover:shadow-[0_15px_40px_rgba(194,225,255,0.4)] hover:scale-105 cursor-pointer whitespace-nowrap">
              <span>CONOCE NUESTRA HISTORIA Y EQUIPO</span>
              <svg class="w-4 h-4 shrink-0 transform group-hover/btn:translate-x-1.5 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-7-7 7 7-7 7"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Scroll Indicators / Navigation Dots -->
    <div class="scroll-dots">
      <span 
        *ngFor="let val of slides; let i = index" 
        class="dot" 
        [class.active]="activeIndex === i"
        (click)="scrollToIndex(i)"
        [attr.title]="val.subtitle">
      </span>
    </div>

  </section>
</div>
